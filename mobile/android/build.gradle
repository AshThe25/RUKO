buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        // 26: ruko-native needs NotificationListenerService, foreground
        // services and the AudioRecord behaviour introduced in Oreo.
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// onnxruntime-react-native asks for `latest.integration`, a dynamic version that
// only resolves against Microsoft's nightly repository. Pinning it to the
// released artifact keeps the build reproducible and offline-buildable, and a
// fraud model should not silently change version between two builds anyway.
allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.microsoft.onnxruntime') {
                details.useVersion '1.20.0'
                details.because 'latest.integration is a nightly channel; pin to a release'
            }
        }
    }
}
