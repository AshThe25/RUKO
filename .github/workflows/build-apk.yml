# Builds the Ruko APK on a runner that has the Android SDK, and commits the
# result back to web/ so the download link on the landing page — and the QR
# code pointing at it — always serve the build that matches main.
#
# The APK was previously produced by hand on a laptop and committed, which is
# why it silently fell behind the source: the icon landed in 3d787b8 but the
# binary was last rebuilt at cb5361d, so the shipped app carried an old code
# path with a known hang. A build that runs on push cannot drift like that.
name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

# The job commits the APK back to main, so it needs write access to contents.
permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # arm64-v8a only, matching the README. The demo phone is arm64 and a
      # universal APK doubles the download for architectures nobody installs.
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publish the APK into web/
        run: |
          set -euo pipefail
          built=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$built"
          cp "$built" web/ruko.apk
          ls -la web/ruko.apk

      - name: Commit it back
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Nothing to do when the binary is byte-identical to what is already
          # committed, which is the common case for a docs-only push.
          if git diff --quiet -- web/ruko.apk; then
            echo 'APK unchanged; nothing to commit.'
            exit 0
          fi
          git add web/ruko.apk
          git commit -m "build(web): rebuild ruko.apk from ${GITHUB_SHA:0:7}"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: ruko-apk
          path: web/ruko.apk
